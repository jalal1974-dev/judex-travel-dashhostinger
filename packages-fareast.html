@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');
:root{
  --primary:#0a1628;--accent:#c8963e;--accent2:#f0b95a;
  --bg:#f5f3ef;--surface:#fff;--surface2:#f9f7f3;
  --border:#e5dfd5;--text:#1a1a1a;--text2:#6b6258;--text3:#a09890;
  --radius:12px;--shadow:0 4px 24px rgba(10,22,40,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl}
nav{background:var(--primary);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.nav-logo{color:#fff;font-size:18px;font-weight:800;text-decoration:none}
.nav-links{display:flex;gap:2px}
.nav-links a{color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:500;padding:7px 13px;border-radius:8px;transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.1)}
.nav-cta{background:var(--accent);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;transition:.2s}

/* HERO */
.hero{background:linear-gradient(150deg,#0a1628 0%,#162a50 60%,#1a3060 100%);padding:48px 24px 38px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,150,62,.1) 0%,transparent 70%);top:-250px;right:-150px}
.hero-inner{position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,150,62,.15);border:1px solid rgba(200,150,62,.3);color:var(--accent2);font-size:12px;font-weight:600;padding:5px 16px;border-radius:20px;margin-bottom:14px}
.hero h1{font-size:32px;font-weight:800;color:#fff;margin-bottom:8px}
.hero p{font-size:14px;color:rgba(255,255,255,.6);max-width:520px;margin:0 auto}

/* PROFIT BAR */
.profit-bar{background:var(--primary);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:62px;z-index:90}
.profit-label{color:rgba(255,255,255,.6);font-size:12px;font-weight:600;white-space:nowrap}
.profit-field{display:flex;align-items:center;gap:6px}
.profit-field input{width:75px;padding:6px 10px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:rgba(255,255,255,.08);color:#fff;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;text-align:center}
.profit-field input:focus{outline:none;border-color:var(--accent2)}
.btn-calc{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-calc:hover{background:var(--accent2)}
.profit-note{color:rgba(255,255,255,.4);font-size:11px;margin-right:auto}

/* DEST TABS */
.dest-tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:111px;z-index:89;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.dest-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.dest-tabs::-webkit-scrollbar{display:none}
.dest-tab{padding:14px 18px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:6px}
.dest-tab:hover{color:var(--primary)}
.dest-tab.active{color:var(--primary);border-bottom-color:var(--accent)}

/* FILTER BAR */
.filter-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text2);transition:.15s;white-space:nowrap}
.filter-btn.active,.filter-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* CONTENT */
.page-content{max-width:1320px;margin:0 auto;padding:24px 20px}
.dest-section{display:none}
.dest-section.active{display:block}

/* PACKAGES GRID */
.packages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-bottom:32px}

/* PACKAGE CARD */
.pkg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .22s;display:flex;flex-direction:column}
.pkg-card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}

/* Card accent bar */
.pkg-bar{height:5px}
.bar-georgia{background:linear-gradient(90deg,#cc0000,#ff9900,#fff)}
.bar-malaysia{background:linear-gradient(90deg,#cc0001,#0100a9,#ff0)}
.bar-thailand{background:linear-gradient(90deg,#00247d,#cf142b,#fff)}
.bar-maldives{background:linear-gradient(90deg,#00894c,#d21034,#fff)}
.bar-indonesia{background:linear-gradient(90deg,#ce1126,#fff)}
.bar-singapore{background:linear-gradient(90deg,#ef3340,#fff)}
.bar-vietnam{background:linear-gradient(90deg,#da251d,#ff0)}
.bar-srilanka{background:linear-gradient(90deg,#8d153a,#f5a623)}

.pkg-head{padding:18px 18px 12px}
.pkg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.pkg-title{font-size:14px;font-weight:700;color:var(--primary);line-height:1.35;flex:1}
.pkg-ref{font-size:10px;color:var(--text3);margin-top:2px}
.pkg-stars{color:var(--accent);font-size:13px;white-space:nowrap}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-nights{background:#e8f0f8;color:#1a4a7a}
.b-type{background:#f0e8d5;color:#8a5a00}
.b-honey{background:#fdf0f8;color:#8a2060}
.b-family{background:#e8f5ee;color:#1a7a4a}
.b-free{background:#e8f5ee;color:#1a7a4a}

/* Hotels list */
.hotels-list{padding:0 18px 10px}
.hotel-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
.hotel-item:last-child{border-bottom:none}
.hotel-city{background:var(--primary);color:#fff;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;margin-top:1px}
.hotel-info{flex:1}
.hotel-name{font-weight:600;color:var(--primary)}
.hotel-detail{color:var(--text3);font-size:10px;margin-top:1px}

/* Tours */
.tours-section{padding:0 18px 10px}
.tours-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tour-item{font-size:11px;color:var(--text2);padding:3px 0;display:flex;align-items:flex-start;gap:5px}
.tour-item::before{content:'•';color:var(--accent);font-size:14px;line-height:1;flex-shrink:0}

/* Includes */
.includes-row{padding:8px 18px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--border)}
.inc-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;background:#f0f8e8;color:#3a6a1a}

/* Price section */
.price-section{padding:14px 18px;background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.price-from{font-size:10px;color:var(--text3);margin-bottom:2px}
.price-main{font-size:24px;font-weight:800;color:var(--accent);line-height:1}
.price-per{font-size:10px;color:var(--text3);margin-top:1px}
.price-dmc{font-size:10px;color:var(--text3)}

.card-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}
.btn-wa{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#25d366;color:#fff;border:none;padding:10px;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:.2s}
.btn-wa:hover{background:#1da851}
.btn-detail{padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-detail:hover{border-color:var(--accent);color:var(--accent)}

/* ITINERARY MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,.6);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:600px;margin:auto}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:1}
.modal-title{font-size:16px;font-weight:700;color:var(--primary)}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text3);line-height:1}
.modal-body{padding:24px}
.day-item{display:flex;gap:14px;margin-bottom:16px}
.day-num{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.day-num.optional{background:var(--accent)}
.day-content{}
.day-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:3px}
.day-loc{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px}
.day-desc{font-size:12px;color:var(--text2);line-height:1.6}
.day-optional-badge{display:inline-block;background:var(--warning-bg,#fef8e6);color:#8a6500;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:4px}

/* SECTION DIVIDER */
.section-divider{display:flex;align-items:center;gap:12px;margin:24px 0 16px}
.section-divider .line{flex:1;height:1px;background:var(--border)}
.section-divider .title{font-size:15px;font-weight:700;color:var(--primary);white-space:nowrap;display:flex;align-items:center;gap:6px}

/* EMPTY */
.empty-state{text-align:center;padding:60px 24px;color:var(--text3)}
.empty-state .ico{font-size:48px;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--primary);color:#fff;padding:12px 24px;border-radius:30px;font-size:13px;z-index:999;transition:.3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:768px){
  .packages-grid{grid-template-columns:1fr}
  .hero h1{font-size:22px}
  .nav-links{display:none}

}

// ══════════════════════════════════════════════════════
// RENDER FUNCTIONS
// ══════════════════════════════════════════════════════

const DEST_DATA = {
  georgia:GEORGIA, malaysia:MALAYSIA, thailand:THAILAND,
  maldives:MALDIVES, indonesia:INDONESIA, singapore:SINGAPORE,
  vietnam:VIETNAM, srilanka:SRILANKA,
};
const DEST_BARS = {
  georgia:'bar-georgia',malaysia:'bar-malaysia',thailand:'bar-thailand',
  maldives:'bar-maldives',indonesia:'bar-indonesia',singapore:'bar-singapore',
  vietnam:'bar-vietnam',srilanka:'bar-srilanka',
};
let currentDest = 'georgia';

function showDest(dest, el) {
  currentDest = dest;
  document.querySelectorAll('.dest-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dest-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('section-'+dest).classList.add('active');
  el.classList.add('active');
  renderSection(dest);
}

function setFilter(val, el) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderSection(currentDest);
}

function renderActive() { renderSection(currentDest); }

function renderSection(dest) {
  const packages = DEST_DATA[dest] || [];
  const filtered = packages.filter(p => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'honeymoon') return p.type === 'honeymoon';
    if (currentFilter === 'family') return p.type === 'family';
    if (currentFilter === 4) return p.stars === 4;
    if (currentFilter === 5) return p.stars === 5;
    return true;
  });

  const el = document.getElementById('section-'+dest);
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="ico">📦</div><p>لا توجد باقات لهذا الفلتر</p></div>';
    return;
  }

  el.innerHTML = `<div class="packages-grid">${filtered.map(p => renderCard(p, dest)).join('')}</div>`;
}

function renderCard(p, dest) {
  const bar = DEST_BARS[dest] || 'bar-georgia';
  const typeLabel = p.type === 'honeymoon' ? '💑 شهر عسل' : '👨‍👩‍👧 عائلي';
  const typeBadge = p.type === 'honeymoon' ? 'b-honey' : 'b-family';
  const starsStr = '⭐'.repeat(p.stars||4);

  // Price
  let displayPrice, priceLabel, pricePer;
  if (dest === 'georgia') {
    // Georgia: price is per person all-in (includes ticket)
    const cheapest = p.hotels ? Math.min(...p.hotels.map(h=>h.d||999)) : p.basePriceJOD||0;
    displayPrice = finalPrice(cheapest);
    priceLabel = 'يبدأ من';
    pricePer = 'JOD / شخص — شامل التذكرة';
  } else {
    // Type 4: DMC price + our ticket (not included)
    displayPrice = finalPrice(p.basePriceJOD||0);
    priceLabel = 'يبدأ من';
    pricePer = 'JOD / شخص — لا تشمل تذكرة الطيران';
  }

  // Hotels HTML
  const hotelsHtml = (p.hotels||[]).map(h => `
    <div class="hotel-item">
      <div class="hotel-city">${h.dest||h.city||'—'} ${h.nights?h.nights+'N':''}</div>
      <div class="hotel-info">
        <div class="hotel-name">${h.name||h.hotel||'—'}</div>
        <div class="hotel-detail">${h.room||h.detail||h.rooms||''}</div>
      </div>
    </div>`).join('');

  // Tours HTML
  const tours = p.tours || p.itinerary?.map(d=>d.title) || [];
  const toursArr = Array.isArray(tours) ? tours : Object.values(tours).flat();
  const toursHtml = toursArr.slice(0,5).map(t => `<div class="tour-item">${t}</div>`).join('');
  const moreCount = toursArr.length - 5;

  // Includes
  const incHtml = (p.includes||[]).slice(0,6).map(i=>`<span class="inc-badge">✓ ${i}</span>`).join('');

  // WA message
  const wa = encodeURIComponent(`السلام عليكم 👋\nأرغب في الاستفسار عن:\n📦 ${p.title}\n💰 السعر من ${displayPrice} JOD\n\nالرجاء التفاصيل الكاملة 🙏`);

  return `
  <div class="pkg-card">
    <div class="pkg-bar ${bar}"></div>
    <div class="pkg-head">
      <div class="pkg-top">
        <div>
          <div class="pkg-title">${p.title}</div>
          <div class="pkg-ref">${p.ref||''} — ${p.subtitle||''}</div>
        </div>
        <div class="pkg-stars">${starsStr}</div>
      </div>
      <div class="badges">
        <span class="badge b-nights">🌙 ${p.nights} ليالٍ</span>
        <span class="badge ${typeBadge}">${typeLabel}</span>
        ${p.visaFree?'<span class="badge b-free">🆓 بدون فيزا</span>':''}
        ${(p.gifts||[]).length?'<span class="badge b-free">🎁 هدايا</span>':''}
      </div>
    </div>
    <div class="hotels-list">${hotelsHtml}</div>
    ${toursArr.length ? `
    <div class="tours-section">
      <div class="tours-title">🗺️ الجولات والأنشطة</div>
      ${toursHtml}
      ${moreCount>0?`<div class="tour-item" style="color:var(--accent);font-weight:600">+ ${moreCount} المزيد...</div>`:''}
    </div>`:''}
    <div class="includes-row">${incHtml}</div>
    <div class="price-section">
      <div>
        <div class="price-from">${priceLabel}</div>
        <div class="price-main">${displayPrice}</div>
        <div class="price-per">${pricePer}</div>
      </div>
      <div style="text-align:left">
        ${(p.gifts||[]).map(g=>`<div style="font-size:10px;color:var(--success,#1a7a4a);font-weight:600">🎁 ${g}</div>`).join('')}
      </div>
    </div>
    <div class="card-foot">
      <a href="https://wa.me/${WA}?text=${wa}" class="btn-wa" target="_blank">💬 احجز الآن</a>
      ${p.itinerary ? `<button class="btn-detail" onclick="showItinerary(${p.id.replace(/\D/g,'')||0},'${dest}')">📋 البرنامج</button>` : ''}
    </div>
  </div>`;
}

function showItinerary(_, dest) {
  // For Georgia packages which have detailed itinerary
  const p = GEORGIA.find(x => x.id === 'g'+_) || GEORGIA[0];
  if (!p || !p.itinerary) return;
  document.getElementById('modal-title').textContent = p.titleAr || p.title;
  document.getElementById('modal-body').innerHTML = p.itinerary.map((d,i) => `
    <div class="day-item">
      <div class="day-num ${d.type==='optional'?'optional':''}">${i+1}</div>
      <div class="day-content">
        ${d.type==='optional'?'<div class="day-optional-badge">اختياري</div>':''}
        <div class="day-title">${d.title}</div>
        <div class="day-loc">📍 ${d.loc}</div>
        <div class="day-desc">${d.desc}</div>
      </div>
    </div>`).join('');
  document.getElementById('pkg-modal').classList.add('open');
}

function closeModal() { document.getElementById('pkg-modal').classList.remove('open'); }
document.getElementById('pkg-modal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });

// INIT
renderSection('georgia');
</script>
